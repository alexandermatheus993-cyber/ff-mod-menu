name: Build FFH4X APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Force Python 3.11 everywhere
        run: |
          sudo apt-get update
          sudo apt-get remove -y python3.14 python3.14-venv 2>/dev/null || true
          PYBIN="${{ env.pythonLocation }}/bin"
          sudo ln -sf "$PYBIN/python3.11" /usr/bin/python3
          sudo ln -sf "$PYBIN/python3.11" /usr/bin/python
          sudo ln -sf "$PYBIN/python3.11" /usr/local/bin/python3
          sudo ln -sf "$PYBIN/python3.11" /usr/local/bin/python
          python --version
          python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "e6b7c2ab7fa2298c15165e9583d0222b24b9a77" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Install dependencies
        run: |
          sudo apt-get install -y build-essential git python3-pip autoconf libssl-dev libffi-dev libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libjpeg-dev
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36
          pip install buildozer

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          buildozer android debug 2>&1 | tail -100
          mkdir -p artifacts
          find . -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffh4x-apk
          path: artifacts/*.apk
          if-no-files-found: warn
