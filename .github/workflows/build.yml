      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          buildozer android debug 2>&1 | tail -100
          echo "=== Procurando APK ==="
          find $GITHUB_WORKSPACE -name "*.apk" -type f 2>/dev/null
          find ~/.buildozer -name "*.apk" -type f 2>/dev/null
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp $(find $GITHUB_WORKSPACE -name "*.apk" -type f | head -1) $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || \
          cp $(find ~/.buildozer -name "*.apk" -type f | head -1) $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || \
          echo "APK NOT FOUND"

